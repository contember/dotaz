name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions: {}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── Prepare version info ──────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major-minor: ${{ steps.version.outputs.major_minor }}
      electrobun-env: ${{ steps.version.outputs.electrobun_env }}
      is-prerelease: ${{ steps.version.outputs.is_prerelease }}
      npm-tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Parse version from tag
        id: version
        run: |
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          MAJOR="${BASE_VERSION%%.*}"
          REST="${BASE_VERSION#*.}"
          MINOR="${REST%%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "electrobun_env=canary" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "electrobun_env=stable" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  # ── Desktop builds (Electrobun) ───────────────────────────
  desktop:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact: dotaz-linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: dotaz-linux-arm64
          - os: macos-15
            platform: macos-arm64
            artifact: dotaz-macos-arm64
          - os: windows-latest
            platform: win-x64
            artifact: dotaz-win-x64
    runs-on: ${{ matrix.os }}
    env:
      # The macOS app is signed only when the repository holds a Developer ID
      # certificate; without it the build stays unsigned, as before.
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Electrobun 2.x downloads its toolchain (Hutch, CEF, Bun) into ~/.hutch on
      # first use. Cache it per electrobun version to keep release runs fast.
      - name: Cache Hutch toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}
          restore-keys: hutch-${{ matrix.platform }}-

      # Projects the Electrobun SDK into .hutch/devkit, which Vite and tsc resolve against.
      - name: Prepare Electrobun devkit
        run: bunx electrobun prepare

      - name: Seed SQLite demo database
        run: bun run seed:sqlite

      - name: Build frontend
        run: bunx vite build

      # The Developer ID signature gives the bundled backend an identity of its own,
      # which the keychain binds the saved-password key to (docs/keychain.md).
      # electrobun.config.ts turns on codesign/notarize when these variables are set.
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Splitting is intended: each existing keychain becomes its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "ELECTROBUN_DEVELOPER_ID=$DEVELOPER_ID" >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "ELECTROBUN_APPLEAPIKEYPATH=$RUNNER_TEMP/AuthKey.p8"
              echo "ELECTROBUN_APPLEAPIKEY=$API_KEY_ID"
              echo "ELECTROBUN_APPLEAPIISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      - name: Build desktop app
        run: bunx electrobun build --env=${{ needs.prepare.outputs.electrobun-env }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Check the backend signature (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          BUILD_DIR="build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          WRAPPER=$(find "$BUILD_DIR" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "::error::No .app bundle under $BUILD_DIR"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$WRAPPER"
          # Release builds ship a self-extracting wrapper; the real app, with the
          # backend's bun, is the .tar.zst in its Resources (as in the Linux step).
          APP="$WRAPPER"
          ARCHIVE=$(find "$WRAPPER/Contents/Resources" -maxdepth 1 -name "*.tar.zst" | head -1)
          if [ -n "$ARCHIVE" ]; then
            command -v zstd > /dev/null || brew install zstd
            INNER=$(mktemp -d)
            zstd -dc "$ARCHIVE" | tar -xf - -C "$INNER"
            APP=$(find "$INNER" -maxdepth 1 -type d -name "*.app" | head -1)
          fi
          BUN="$APP/Contents/MacOS/bun"
          if [ ! -f "$BUN" ]; then
            echo "::error::No Contents/MacOS/bun in the built app; cannot check the backend signature"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$APP"
          # Electrobun logs a failed signature and carries on, and the keychain binds
          # the saved-password key to this requirement, so it must name the release
          # team, not Bun's.
          TEAM="${ELECTROBUN_DEVELOPER_ID##*(}"
          TEAM="${TEAM%)}"
          REQUIREMENT=$(codesign -d -r- "$BUN" 2>&1)
          echo "$REQUIREMENT"
          case "$REQUIREMENT" in
            *"subject.OU] = \"$TEAM\""* | *"subject.OU] = $TEAM"*) ;;
            *) echo "::error::Contents/MacOS/bun is not signed with the release Developer ID"; exit 1 ;;
          esac

      - name: Remove signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Extract app from Electrobun installer (Linux)
        if: runner.os == 'Linux'
        run: |
          BUILD_DIR="build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          APP_DIR=$(find "$BUILD_DIR" -maxdepth 1 -type d -name "Dotaz*" | head -1)
          ARCHIVE=$(find "$APP_DIR/Resources" -name "*.tar.zst" 2>/dev/null | head -1)
          if [ -n "$ARCHIVE" ]; then
            echo "Extracting app from installer archive: $ARCHIVE"
            EXTRACT_DIR=$(mktemp -d)
            tar --zstd -xf "$ARCHIVE" -C "$EXTRACT_DIR"
            rm -rf "$APP_DIR"
            EXTRACTED=$(find "$EXTRACT_DIR" -maxdepth 1 -type d -name "Dotaz*" | head -1)
            mv "$EXTRACTED" "$APP_DIR"
            rm -rf "$EXTRACT_DIR"
          fi

      - name: Extract app from Electrobun installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          $appDir = Get-ChildItem -Path $buildDir -Directory -Filter "Dotaz*" | Select-Object -First 1
          $archive = Get-ChildItem -Path "$($appDir.FullName)\Resources" -Filter "*.tar.zst" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($archive) {
            Write-Host "Extracting app from installer archive: $($archive.FullName)"
            $extractDir = Join-Path ([System.IO.Path]::GetTempPath()) "dotaz-extract-$(Get-Random)"
            New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
            tar --zstd -xf $archive.FullName -C $extractDir
            Remove-Item -Recurse -Force $appDir.FullName
            $extracted = Get-ChildItem -Path $extractDir -Directory -Filter "Dotaz*" | Select-Object -First 1
            Move-Item -Path $extracted.FullName -Destination $appDir.FullName
            Remove-Item -Recurse -Force $extractDir
          }

      - name: Embed icon into Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          $appDir = Get-ChildItem -Path $buildDir -Directory -Filter "Dotaz*" | Select-Object -First 1
          $iconIco = Resolve-Path "assets\icon.ico"

          # Install rcedit in isolated temp dir (avoids workspace:* conflict)
          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) "icon-tools"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          Push-Location $tempDir
          npm init -y | Out-Null
          npm install rcedit --silent
          Pop-Location

          # Embed icon into executables and copy .ico for shortcuts
          $rcedit = Join-Path $tempDir "node_modules\rcedit\bin\rcedit-x64.exe"
          & $rcedit "$($appDir.FullName)\bin\launcher.exe" --set-icon $iconIco
          & $rcedit "$($appDir.FullName)\bin\bun.exe" --set-icon $iconIco
          Copy-Item $iconIco "$($appDir.FullName)\Resources\app.ico"
          Write-Host "Icon embedded into launcher.exe and bun.exe"

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          BUILD_DIR="build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          tar -czf ${{ matrix.artifact }}.tar.gz -C "$BUILD_DIR" .

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          $appDir = (Get-ChildItem -Path $buildDir -Directory -Filter "Dotaz*" | Select-Object -First 1).FullName
          iscc /DAppVersion=${{ needs.prepare.outputs.version }} /DAppDir="$appDir" /DOutputDir="$PWD" installer\dotaz.iss

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "build/${{ needs.prepare.outputs.electrobun-env }}-${{ matrix.platform }}"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            dotaz-win-x64-setup.exe
          if-no-files-found: error

      - name: Upload update artifacts
        if: hashFiles('artifacts/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.platform }}
          path: artifacts/*

  # ── Docker image ──────────────────────────────────────────
  docker:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major-minor }},enable=${{ needs.prepare.outputs.is-prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is-prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Server npm package (trusted publisher) ───────────────
  npm-server:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build server package
        run: bun run build:server
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Publish to npm
        run: npm publish --tag ${{ needs.prepare.outputs.npm-tag }} --access public --provenance
        working-directory: dist-server

  # ── Agent CLI npm package (trusted publisher) ────────────
  npm-cli:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build agent CLI package
        run: bun run build:agent-cli
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Smoke-test agent CLI package
        working-directory: dist-agent-cli
        run: |
          test "$(./bin/dotaz.js --version)" = "dotaz ${{ needs.prepare.outputs.version }}"
          ./bin/dotaz.js --help > /dev/null
          PACKAGE_TARBALL=$(npm pack --silent)
          TEST_DIR=$(mktemp -d)
          npm install --prefix "$TEST_DIR" "$PWD/$PACKAGE_TARBALL"
          test "$(cd "$TEST_DIR" && bunx --no-install @dotaz/cli --version)" = "dotaz ${{ needs.prepare.outputs.version }}"

      - name: Publish to npm
        run: npm publish --tag ${{ needs.prepare.outputs.npm-tag }} --access public --provenance
        working-directory: dist-agent-cli

  # ── GitHub Release ────────────────────────────────────────
  release:
    needs: [prepare, desktop, docker, npm-server, npm-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dotaz-*
          merge-multiple: true

      - name: Download update artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: update-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Dotaz ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/*
