name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # typecheck resolves `electrobun/*` from .hutch/devkit, which Hutch projects
      # from its toolchain store — cached here to keep the check job fast.
      - name: Cache Hutch toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-linux-x64-${{ hashFiles('bun.lock') }}
          restore-keys: hutch-linux-x64-

      - name: Prepare Electrobun devkit
        run: bunx electrobun prepare

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Test (unit — no external DB required)
        run: |
          shopt -s extglob
          bun test tests/!(pg-*|postgres-*|mysql-*|multi-database|driver-iterate|ui-store).test.ts

  integration:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start docker-compose services
        run: docker compose up -d --wait

      - name: Test (integration — requires docker)
        run: |
          shopt -s extglob
          bun test tests/@(pg-*|postgres-*|mysql-*|multi-database|driver-iterate).test.ts

      - name: Show docker-compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop docker-compose services
        if: always()
        run: docker compose down
